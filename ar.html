  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 {
      font-size: 1.2rem;
      margin: 1rem;
      text-align: center;
    }
    model-viewer {
      width: 100%;
      max-width: 500px;
      height: 400px;
      background-color: #222;
    }
    p {
      max-width: 500px;
      margin: 1rem;
      font-size: 0.9rem;
      opacity: 0.8;
      text-align: center;
    }
  </style>
</head>
