<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MindAR Image Tracking</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; background: #000; }
  </style>
</head>
<body>

<a-scene
  mindar-image="imageTargetSrc: c; autoStart: true; uiLoading: yes; uiScanning: yes;"
  color-space="sRGB"
  renderer="colorManagement: true; physicallyCorrectLights: true;"
  vr-mode-ui="enabled: false"
  embedded
  loading-screen="enabled: false">

  <a-assets>
    <a-asset-item id="model"
                  src="https://cdn.jsdelivr.net/gh/SofyZh/TRPP@master/HORNET.glb">
    </a-asset-item>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-light type="ambient" intensity="0.7"></a-light>
  <a-light type="directional" intensity="0.6" position="0 1 2"></a-light>

  <a-entity mindar-image-target="targetIndex: 0">
    <a-gltf-model
      src="#model"
      position="0 0 0.1"
      scale="0.005 0.005 0.005"
      animation="property: position; to: 0 0.1 0.1; dur: 1000; loop: true; dir: alternate">
    </a-gltf-model>
  </a-entity>

</a-scene>

</body>
</html>
